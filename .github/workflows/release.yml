name: Release

on:
  push:
    tags:
      - 'v*'
      - '!*-*'  # Exclude pre-release tags
  workflow_dispatch:
    inputs:
      version_to_unlist:
        description: 'Module version to unlist from PowerShell Gallery (e.g. 0.1.0).'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Module
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.1

      - name: Build & Package Module
        shell: pwsh
        run: ./build.ps1 -ResolveDependency -tasks pack
        env:
          ModuleVersion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: module-output
          path: output/

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: module-output
          path: output/

      - name: Run Tests
        shell: pwsh
        run: ./build.ps1 -tasks test

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: module-output
          path: output/

      - name: Publish to PSGallery
        shell: pwsh
        run: ./build.ps1 -tasks publish
        env:
          GitHubToken: ${{ secrets.GITHUB_TOKEN }}
          GalleryApiToken: ${{ secrets.PSGALLERY_API_KEY }}
          ReleaseBranch: main
          MainGitBranch: main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/*.nupkg

      - name: Determine Previous Version
        # The tag just pushed vs. the tag immediately before it by creation
        # order, restricted to release tags (vN.N.N, no pre-release suffix).
        # First-ever release has no previous tag - the next step is skipped.
        id: previous_version
        shell: bash
        run: |
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=$(git tag --sort=-creatordate | grep -v -F "$current_tag" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          echo "tag=${previous_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${previous_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Unlist Superseded Version from PSGallery
        # Best-effort: must never fail the release - the new version has
        # already published successfully by this point.
        if: steps.previous_version.outputs.version != ''
        shell: pwsh
        continue-on-error: true
        run: |
          $ModuleName = 'Invoke-ADDS'
          $Version = $env:PREVIOUS_VERSION
          $Uri = "https://www.powershellgallery.com/api/v2/package/$ModuleName/$Version"
          Invoke-WebRequest -Uri $Uri -Method Delete -Headers @{ 'X-NuGet-ApiKey' = $env:GalleryApiToken }
          Write-Host "Unlisted superseded version $ModuleName $Version (superseded by $env:CURRENT_TAG)."
        env:
          PREVIOUS_VERSION: ${{ steps.previous_version.outputs.version }}
          CURRENT_TAG: ${{ github.ref_name }}
          GalleryApiToken: ${{ secrets.PSGALLERY_API_KEY }}

  unlist:
    name: Unlist from PSGallery
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Unlist version
        shell: pwsh
        run: |
          $ModuleName = 'Invoke-ADDS'
          $Version = $env:VERSION_TO_UNLIST
          if ($Version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Version '$Version' doesn't look like a semantic version (e.g. 0.1.0) - refusing to proceed."
          }
          $Uri = "https://www.powershellgallery.com/api/v2/package/$ModuleName/$Version"
          Invoke-WebRequest -Uri $Uri -Method Delete -Headers @{ 'X-NuGet-ApiKey' = $env:GalleryApiToken }
          Write-Host "Unlisted $ModuleName $Version from PowerShell Gallery."
        env:
          VERSION_TO_UNLIST: ${{ inputs.version_to_unlist }}
          GalleryApiToken: ${{ secrets.PSGALLERY_API_KEY }}
